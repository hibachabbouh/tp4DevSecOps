apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-hardening
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      validate:
        message: "Le tag ':latest' est interdit : utilisez un digest ou une version immuable."
        pattern:
          spec:
            containers:
              - image: "!*:latest"

    - name: require-non-root-no-privilege
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      validate:
        message: "Interdit : root, mode privilegie ou escalade de privileges."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  =(privileged): false